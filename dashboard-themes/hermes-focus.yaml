name: hermes-focus
label: Hermes Focus
description: Calm agent workbench with clearer navigation, stronger focus, and responsive chat chrome

palette:
  background: "#f4f6f8"
  midground: "#172033"
  foreground:
    hex: "#2563eb"
    alpha: 0
  warmGlow: "rgba(37, 99, 235, 0.08)"
  noiseOpacity: 0

typography:
  fontSans: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
  fontMono: '"JetBrains Mono", "SFMono-Regular", Consolas, monospace'
  fontDisplay: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
  baseSize: "15px"
  lineHeight: "1.55"
  letterSpacing: "0"

layout:
  radius: "0.75rem"
  density: comfortable

layoutVariant: tiled

terminalBackground: "#fcfcfd"
terminalForeground: "#182033"

seriesColors:
  inputTokenAccent: "#7c3aed"
  outputTokenAccent: "#0891b2"

colorOverrides:
  card: "#ffffff"
  cardForeground: "#172033"
  popover: "#ffffff"
  popoverForeground: "#172033"
  primary: "#2563eb"
  primaryForeground: "#ffffff"
  secondary: "#eef2f7"
  secondaryForeground: "#263247"
  muted: "#eef2f7"
  mutedForeground: "#617087"
  accent: "#e8efff"
  accentForeground: "#1746a2"
  destructive: "#c93c37"
  destructiveForeground: "#ffffff"
  success: "#16865b"
  warning: "#a86205"
  border: "#d9e0e8"
  input: "#cbd5e1"
  ring: "#2563eb"

componentStyles:
  sidebar:
    background: "linear-gradient(180deg, #fbfcfe 0%, #f3f6fa 100%)"
  header:
    background: "rgba(255, 255, 255, 0.94)"
  card:
    boxShadow: "0 1px 2px rgba(15, 23, 42, 0.04)"
  page:
    background: "#f4f6f8"

customCSS: |
  :root {
    --text-primary: #172033;
    --text-secondary: #46556b;
    --text-tertiary: #617087;
    --text-disabled: #8b97a8;
    --text-display: #172033;
    --color-text-primary: #172033;
    --color-text-secondary: #46556b;
    --color-text-tertiary: #617087;
    --color-text-disabled: #8b97a8;
    --color-text-display: #172033;
    --font-rules-compressed: var(--theme-font-sans);
    --font-rules-expanded: var(--theme-font-sans);
    --font-mondwest: var(--theme-font-sans);
    --focus-blue: #2563eb;
    --focus-blue-soft: #e8efff;
    --focus-canvas: #f4f6f8;
    --focus-surface: #ffffff;
    --focus-border: #d9e0e8;
  }

  body {
    color: var(--text-primary);
    background: var(--focus-canvas);
  }

  /* The global rail is navigation, not a poster: improve scanning and make
     the selected destination unmistakable without adding more chrome. */
  #app-sidebar {
    border-right-color: var(--focus-border) !important;
    box-shadow: 1px 0 0 rgba(15, 23, 42, 0.02);
  }

  #app-sidebar > div:first-child {
    border-bottom-color: var(--focus-border) !important;
  }

  #app-sidebar nav {
    padding: 0.45rem;
  }

  #app-sidebar nav a {
    min-height: 2.5rem;
    margin: 1px 0;
    padding: 0.55rem 0.75rem;
    border-radius: 0.55rem;
    font-size: 0.78rem;
    font-weight: 560;
    letter-spacing: 0.055em;
  }

  #app-sidebar nav a:hover {
    background: rgba(37, 99, 235, 0.055);
  }

  #app-sidebar nav a[aria-current="page"] {
    color: #1746a2 !important;
    background: var(--focus-blue-soft);
  }

  #app-sidebar nav a[aria-current="page"] > span:last-child {
    width: 3px;
    top: 0.5rem;
    bottom: 0.5rem;
    left: 0.25rem;
    border-radius: 999px;
    background: var(--focus-blue);
  }

  /* System actions remain available but no longer compete with primary nav. */
  #app-sidebar nav + div {
    background: rgba(255, 255, 255, 0.48);
  }

  /* Page title bar reads as stable workspace chrome. */
  main + * { min-width: 0; }

  header[role="banner"] {
    border-bottom-color: var(--focus-border) !important;
    backdrop-filter: blur(14px) saturate(1.1);
  }

  header[role="banner"] h1 {
    font-size: 0.9rem;
    letter-spacing: 0.015em;
  }

  /* Chat is the primary work surface: a quiet canvas, a bounded transcript,
     and a visibly secondary model/session inspector. */
  [data-chat-active="true"] {
    width: 100%;
    max-width: 1680px;
    margin-inline: auto;
  }

  [data-chat-active="true"] > div > div.flex.min-h-0.flex-1.flex-col {
    gap: 0.75rem;
  }

  [data-chat-active="true"] .hermes-chat-xterm-host {
    border-radius: 0.75rem;
  }

  [data-chat-active="true"] div:has(> .hermes-chat-xterm-host) {
    border: 1px solid var(--focus-border);
    border-radius: 1rem !important;
    background: var(--focus-surface) !important;
    box-shadow:
      0 1px 2px rgba(15, 23, 42, 0.04),
      0 12px 32px rgba(15, 23, 42, 0.06) !important;
  }

  #chat-side-panel {
    --theme-font-mono: var(--theme-font-sans);
    width: 17rem;
    padding: 0.75rem 0.6rem 0.6rem;
    border: 1px solid var(--focus-border);
    border-radius: 1rem;
    background: rgba(255, 255, 255, 0.76);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.045);
  }

  #chat-side-panel > div:first-child {
    height: 1.75rem;
  }

  #chat-side-panel button,
  [data-chat-active="true"] button {
    letter-spacing: 0.01em;
  }

  #chat-side-panel [class*="tracking-wider"] {
    letter-spacing: 0.06em;
  }

  #chat-side-panel [class*="text-xs"] {
    line-height: 1.45;
  }

  /* Preserve terminal readability; interface text should not inherit the
     product's original display-font tracking. */
  #app-sidebar,
  #chat-side-panel,
  header[role="banner"] {
    font-family: var(--theme-font-sans);
  }

  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--focus-blue) !important;
    outline-offset: 2px;
  }

  @media (max-width: 1023px) {
    [data-chat-active="true"] {
      width: 100%;
      max-width: none;
    }

    [data-chat-active="true"] div:has(> .hermes-chat-xterm-host) {
      border-radius: 0.75rem !important;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05) !important;
    }

    #chat-side-panel {
      background: rgba(251, 252, 254, 0.985);
      backdrop-filter: blur(16px) saturate(1.05);
    }
  }

  @media (max-width: 640px) {
    html,
    body,
    #root {
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
    }

    header[role="banner"] {
      min-width: 0;
    }

    header[role="banner"] > div {
      max-width: 100%;
      padding-inline: 0.75rem;
    }

    [data-chat-active="true"] div:has(> .hermes-chat-xterm-host) {
      min-width: 0 !important;
      padding: 0.5rem !important;
      border-radius: 0.625rem !important;
    }

    [data-chat-active="true"] button {
      max-width: calc(100vw - 1.5rem);
    }

    header[role="banner"] button[aria-controls="chat-side-panel"] {
      width: 2.5rem;
      min-width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      justify-content: center;
      color: #1746a2;
      background: var(--focus-blue-soft);
      border-color: #bfd0fb;
    }

    header[role="banner"] button[aria-controls="chat-side-panel"] > span {
      gap: 0;
      font-size: 0;
    }

    header[role="banner"] button[aria-controls="chat-side-panel"] svg {
      width: 1rem;
      height: 1rem;
    }

    [data-chat-active="true"] button[aria-label="Copy last assistant response"]
      span span:last-child {
      display: none !important;
    }

    #app-sidebar nav a {
      min-height: 2.75rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
