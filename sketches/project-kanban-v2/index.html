<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Kanban v2 — visual MVP</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f6f6f6;--surface:#fff;--sidebar:#f1f1f1;--panel:#fafafa;--text:#262626;
      --muted:#666;--quiet:#858585;--border:#d7d7d7;--strong:#c3c3c3;--accent:#0875c1;
      --accent-soft:#e6f3fc;--blue:#1677c8;--blue-soft:#e8f3fc;--green:#16825d;
      --green-soft:#e7f5ef;--orange:#a65f00;--orange-soft:#fff1dc;--purple:#7456a8;
      --purple-soft:#f0eafb;--red:#b83a3a;--red-soft:#fbe9e9;--shadow:0 14px 34px rgba(0,0,0,.13)
    }
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .app{display:grid;grid-template-columns:52px minmax(0,1fr);height:100%}.rail{display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--sidebar)}
    .brand{display:grid;height:52px;place-items:center;border-bottom:1px solid var(--border)}.brand span{display:grid;width:26px;height:26px;place-items:center;border-radius:7px;background:var(--accent);color:#fff;font-size:11px;font-weight:750}
    .rail-nav{display:grid;gap:4px;padding:9px 6px}.rail-button{display:grid;width:40px;height:36px;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}.rail-button:hover{background:#e6e6e6}.rail-button.active{background:#dcecf8;color:#075e99}.rail-bottom{margin-top:auto;padding:9px 6px}
    main{display:flex;min-width:0;flex-direction:column;overflow:hidden;background:var(--surface)}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;border-bottom:1px solid var(--border);padding:11px 16px;background:var(--surface)}
    .title-line{display:flex;align-items:center;gap:9px}.title-line h1{margin:0;font-size:18px;font-weight:690;letter-spacing:-.015em}.subtitle{margin-top:2px;color:var(--muted);font-size:11px}.fixture{flex:none;border:1px solid #9ec7e3;border-radius:999px;background:var(--accent-soft);padding:4px 9px;color:#075e99;font-size:9px;font-weight:750;letter-spacing:.06em;text-transform:uppercase}
    .viewbar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);background:var(--panel);padding:8px 16px}.views,.filters{display:flex;min-width:0;gap:5px;overflow:auto}.view,.filter{flex:none;border:1px solid transparent;border-radius:6px;background:transparent;padding:6px 9px;color:var(--muted);cursor:pointer}.view:hover,.filter:hover{background:#ececec;color:var(--text)}.view.active,.filter.active{border-color:#9dc7e3;background:var(--accent-soft);color:#075e99;font-weight:660}.count{margin-left:4px;color:var(--quiet);font-size:10px}.office{display:inline-flex;align-items:center;gap:5px}.office-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding:7px 16px}.toolbar.hidden{display:none}.filters{gap:4px}.filter{border-radius:999px;padding:5px 9px;font-size:11px}.add{border:1px solid #0769aa;border-radius:6px;background:var(--accent);padding:6px 10px;color:#fff;font-weight:650;cursor:pointer}.add:hover{background:#0668aa}
    .content{display:flex;min-height:0;flex:1}.stage{min-width:0;flex:1;overflow:auto;padding:12px 14px;background:var(--bg)}.detail{width:330px;flex:none;overflow:auto;border-left:1px solid var(--border);background:var(--surface)}.detail:empty{display:none}
    .capture{display:none;grid-template-columns:minmax(0,1fr) 170px auto;gap:7px;margin-bottom:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:8px}.capture.open{display:grid}.control{min-width:0;height:34px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:0 10px}.save{border:1px solid #0769aa;border-radius:6px;background:var(--accent);padding:0 12px;color:#fff;font-weight:650}
    .board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px}.lane{min-width:0;border:1px solid var(--border);border-radius:8px;background:#f1f1f1;padding:9px}.lane-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px}.lane-title{display:flex;align-items:center;gap:7px;font-weight:670}.dot{width:8px;height:8px;border-radius:50%}.dot.next{background:var(--blue)}.dot.doing{background:var(--green)}.dot.waiting{background:var(--orange)}.dot.review{background:var(--purple)}.lane-count{border-radius:999px;background:#e2e2e2;padding:1px 6px;color:var(--quiet);font-size:10px}.cards{display:grid;gap:8px}.empty{border:1px dashed var(--strong);border-radius:7px;padding:28px 8px;color:var(--quiet);text-align:center;font-size:11px}
    .card{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:10px;box-shadow:0 1px 1px rgba(0,0,0,.03)}.card.selected{border-color:var(--accent)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:6px}.project-pill{max-width:75%;overflow:hidden;border-radius:4px;background:var(--blue-soft);padding:2px 6px;color:#17649b;font-size:9px;font-weight:740;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}.priority{color:var(--red);font-size:9px;font-weight:750;text-transform:uppercase}.card-title{display:block;width:100%;margin:7px 0 0;border:0;background:transparent;padding:0;text-align:left;font-weight:670;line-height:1.35;cursor:pointer}.card-title:hover{text-decoration:underline}.card-body{display:-webkit-box;margin-top:4px;overflow:hidden;color:var(--muted);font-size:11px;-webkit-box-orient:vertical;-webkit-line-clamp:2}.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.badges,.moves{display:flex;gap:4px}.badge{display:grid;width:21px;height:21px;place-items:center;border:1px solid var(--border);border-radius:5px;background:var(--panel);color:var(--muted);font-size:10px}.move{display:grid;width:23px;height:23px;place-items:center;border:0;border-radius:5px;background:transparent;color:var(--muted);cursor:pointer}.move:hover{background:#ececec;color:var(--text)}
    .detail-wrap{padding:14px}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:13px 14px}.close{display:grid;width:28px;height:28px;place-items:center;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}.close:hover{background:#eee}.kicker{color:var(--quiet);font-size:9px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.detail h2{margin:4px 0 0;font-size:15px;line-height:1.3}.detail-section{margin-bottom:14px}.section-label{margin-bottom:6px;color:var(--quiet);font-size:9px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}.truth{overflow:hidden;border:1px solid var(--border);border-radius:7px}.truth-row{padding:9px 10px}.truth-row+.truth-row{border-top:1px solid #ececec}.field{color:var(--quiet);font-size:9px;font-weight:700;text-transform:uppercase}.value{margin-top:3px;font-size:11px}.value.strong{font-weight:660}.value.blocked{color:var(--red)}.evidence{display:grid;gap:7px}.evidence-row{border:1px solid var(--border);border-radius:7px;background:var(--panel);padding:8px 9px}.evidence-title{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:680}.source{border-radius:4px;padding:2px 5px;font-size:8px;font-weight:750;text-transform:uppercase}.source.obsidian{background:var(--purple-soft);color:#654592}.source.github{background:#e9e9e9;color:#555}.source.device{background:var(--blue-soft);color:#17649b}.fresh,.stale{border-radius:999px;padding:1px 5px;font-size:8px;font-weight:740}.fresh{background:var(--green-soft);color:var(--green)}.stale{background:var(--orange-soft);color:var(--orange)}.evidence-main{margin-top:6px;font-size:11px;font-weight:650}.evidence-sub{margin-top:2px;color:var(--quiet);font-size:9px}.boundary{border-left:3px solid var(--blue);background:var(--blue-soft);padding:8px 9px;color:#365f7b;font-size:10px}
    .projects-layout{display:grid;grid-template-columns:minmax(360px,44%) minmax(420px,56%);min-height:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden}.project-list{min-width:0;border-right:1px solid var(--border)}.list-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:10px 12px;font-weight:670}.project-row{display:grid;width:100%;grid-template-columns:minmax(0,1fr) auto;gap:8px;border:0;border-bottom:1px solid #ededed;background:transparent;padding:11px 12px;text-align:left;cursor:pointer}.project-row:hover{background:var(--panel)}.project-row.selected{background:var(--accent-soft)}.project-name,.project-next{display:block}.project-name{font-weight:670}.project-next{margin-top:3px;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.project-meta{display:flex;gap:9px;margin-top:6px;color:var(--quiet);font-size:9px}.stale-text{color:var(--orange);font-weight:650}.chevron{align-self:center;color:var(--quiet);font-size:17px}.project-detail{min-width:0;background:var(--panel);padding:18px}.project-detail h2{margin:3px 0 2px;font-size:19px}.project-actions{display:flex;gap:7px;margin:10px 0 14px}.button{border:1px solid var(--strong);border-radius:6px;background:#fff;padding:6px 10px;cursor:pointer}.button.primary{border-color:#0769aa;background:var(--accent);color:#fff;font-weight:650}
    .unmatched-help{margin:10px;border:1px solid #b5cde0;border-radius:7px;background:var(--accent-soft);padding:9px 10px;color:#315f80;font-size:10px}.unmatched-row{border-bottom:1px solid #ededed;padding:11px 12px}.unmatched-name{font-weight:660}.unmatched-meta{margin-top:3px;color:var(--muted);font-size:10px}
    .inbox-boundary{display:grid;max-width:620px;min-height:320px;margin:30px auto;place-items:center;border:1px dashed var(--strong);border-radius:9px;background:var(--surface);padding:30px;text-align:center}.inbox-boundary .icon{font-size:28px}.inbox-boundary h2{margin:8px 0 4px;font-size:16px}.inbox-boundary p{max-width:430px;margin:0;color:var(--muted);font-size:11px}
    .toast{position:fixed;z-index:20;right:18px;bottom:16px;max-width:360px;transform:translateY(16px);border-radius:7px;background:#2d2d2d;padding:9px 12px;color:#fff;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.18s}.toast.show{transform:translateY(0);opacity:1}
    @media(max-width:1080px){.board{grid-template-columns:repeat(2,minmax(230px,1fr))}.detail{position:fixed;inset:0 0 0 auto;z-index:12;width:min(360px,100%);box-shadow:var(--shadow)}.projects-layout{grid-template-columns:1fr}.project-detail{display:none;position:fixed;inset:0 0 0 52px;z-index:11;overflow:auto}.projects-layout.detail-open .project-detail{display:block}.projects-layout.detail-open .project-list{visibility:hidden}.capture{grid-template-columns:1fr}}
    @media(max-width:650px){.header{padding:9px 11px}.fixture{display:none}.viewbar{align-items:stretch;flex-direction:column;padding:7px 10px}.toolbar{padding:7px 10px}.stage{padding:9px}.board{grid-template-columns:1fr}.lane:not(.mobile-active){display:none}.projects-layout{border-radius:0}.project-detail{inset-left:52px;padding:13px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Hermes navigation">
      <div class="brand"><span>H</span></div>
      <nav class="rail-nav">
        <button class="rail-button" title="Sessions">◫</button>
        <button class="rail-button" title="Artifacts">◇</button>
        <button class="rail-button active" title="Project Kanban">▦</button>
        <button class="rail-button" title="Scheduled jobs">◷</button>
      </nav>
      <div class="rail-bottom"><button class="rail-button" title="Settings">⚙</button></div>
    </aside>
    <main>
      <header class="header">
        <div>
          <div class="title-line"><h1>Project Kanban</h1><span class="subtitle">v2 direction</span></div>
          <div class="subtitle">8 managed projects · Obsidian truth · GitHub and device evidence</div>
        </div>
        <span class="fixture">Synthetic fixture</span>
      </header>
      <div class="viewbar">
        <div class="views" role="tablist">
          <button class="view active" data-view="board">▦ Board <span class="count">6</span></button>
          <button class="view" data-view="projects">◫ Projects <span class="count">8</span></button>
          <button class="view" data-view="inbox"><span class="office"><span class="office-dot"></span> Office Inbox</span> <span class="count">3</span></button>
        </div>
        <span class="subtitle">One plugin · one native board</span>
      </div>
      <div class="toolbar" id="toolbar">
        <div class="filters">
          <button class="filter active" data-category="all">All <span class="count">6</span></button>
          <button class="filter" data-category="main-research">Main research <span class="count">3</span></button>
          <button class="filter" data-category="student-projects">Student projects <span class="count">2</span></button>
          <button class="filter" data-category="systems-admin">Systems / admin <span class="count">1</span></button>
        </div>
        <button class="add" id="add-action">＋ Next action</button>
      </div>
      <div class="content">
        <section class="stage" id="stage"></section>
        <aside class="detail" id="detail"></aside>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const projects=[
      {id:'prairie-drought',name:'Prairie Drought Initiative',category:'main-research',categoryLabel:'Main research',goal:'Identify stable drought-response traits across field environments.',next:'Approve the 2026 field validation cohort.',blocker:'Awaiting the weather-station calibration report.',github:'example-lab/prairie-drought',push:'Aug 23 · 2 commits',device:'MacLaptop-new',observed:'Today · 8:00 AM',activity:'Aug 23 · 6:42 PM',dirty:3,ahead:1,stale:false},
      {id:'field-robotics',name:'Field Robotics Platform',category:'student-projects',categoryLabel:'Student projects',goal:'Deliver a reproducible autonomous field-scanning workflow.',next:'Review navigation test results with the student team.',blocker:'',github:'example-lab/field-robotics',push:'Aug 22 · pull request open',device:'Office Desktop',observed:'Yesterday · 8:01 AM',activity:'Aug 22 · 4:10 PM',dirty:0,ahead:0,stale:false},
      {id:'seed-inventory',name:'Seed Inventory Service',category:'systems-admin',categoryLabel:'Systems / admin',goal:'Make seed availability and requests visible to the lab.',next:'Confirm the import fields with the stockroom manager.',blocker:'Needs the revised spreadsheet schema.',github:'example-lab/seed-inventory',push:'Aug 20 · 1 commit',device:'MacLaptop-new',observed:'Today · 8:00 AM',activity:'Aug 20 · 11:18 AM',dirty:0,ahead:0,stale:false},
      {id:'genomics-kb',name:'Genomics Knowledge Base',category:'main-research',categoryLabel:'Main research',goal:'Create a curated, role-aware genomics reference.',next:'Review the first eight canonical project notes.',blocker:'',github:'example-lab/genomics-kb',push:'Aug 24 · 4 commits',device:'MacLaptop-new',observed:'Today · 8:00 AM',activity:'Today · 7:44 AM',dirty:2,ahead:0,stale:false},
      {id:'yield-prediction',name:'Yield Prediction Study',category:'main-research',categoryLabel:'Main research',goal:'Benchmark interpretable prediction models across seasons.',next:'Write the validation-set decision in Obsidian.',blocker:'',github:'example-lab/yield-prediction',push:'Aug 18 · no open PRs',device:'Office Desktop',observed:'9 days ago · 8:03 AM',activity:'Aug 18 · 2:14 PM',dirty:0,ahead:0,stale:true},
      {id:'methods-workshop',name:'Graduate Methods Workshop',category:'student-projects',categoryLabel:'Student projects',goal:'Prepare a practical reproducible-analysis workshop.',next:'Choose the worked example for session two.',blocker:'',github:'',push:'',device:'Office Desktop',observed:'Yesterday · 8:01 AM',activity:'Aug 21 · 10:30 AM',dirty:0,ahead:0,stale:false},
      {id:'lab-website',name:'Lab Website Renewal',category:'systems-admin',categoryLabel:'Systems / admin',goal:'Publish a maintainable public lab presence.',next:'Approve the new Projects page hierarchy.',blocker:'',github:'example-lab/lab-website',push:'Aug 24 · deployment passed',device:'MacLaptop-new',observed:'Today · 8:00 AM',activity:'Today · 7:12 AM',dirty:0,ahead:0,stale:false},
      {id:'ev-analysis',name:'EV Charging Analysis',category:'student-projects',categoryLabel:'Student projects',goal:'Quantify charging access around regional campuses.',next:'Check the outlier stations before modeling.',blocker:'',github:'example-lab/ev-analysis',push:'Aug 19 · 1 commit',device:'MacLaptop-new',observed:'Today · 8:00 AM',activity:'Aug 19 · 5:04 PM',dirty:1,ahead:0,stale:false}
    ];
    let cards=[
      {id:'a1',project:'prairie-drought',lane:'next',title:'Approve the 2026 field validation cohort',body:'Decision is recorded in the canonical Obsidian project note.',source:'manual',priority:''},
      {id:'a2',project:'field-robotics',lane:'next',title:'Review navigation test results',body:'Student team requested feedback before Friday.',source:'manual',priority:'Request'},
      {id:'a3',project:'genomics-kb',lane:'doing',title:'Review canonical project notes',body:'Confirm project_id, status, goal, next action, and blocker.',source:'manual',priority:''},
      {id:'a4',project:'seed-inventory',lane:'waiting',title:'Confirm import fields',body:'Waiting for the revised stockroom spreadsheet schema.',source:'manual',priority:''},
      {id:'a5',project:'lab-website',lane:'review',title:'Approve Projects page hierarchy',body:'Preview is ready for owner review.',source:'github',priority:'Git activity'},
      {id:'a6',project:'ev-analysis',lane:'doing',title:'Check outlier charging stations',body:'Three stations need source validation.',source:'manual',priority:''}
    ];
    const unmatched=[
      {name:'canopy-image-pilot',meta:'GitHub · pushed yesterday · no canonical project_id'},
      {name:'untitled-field-export',meta:'MacLaptop-new · local Git · 2 dirty files'},
      {name:'archive-migration-notes',meta:'Office Desktop · non-Git folder · no local mapping'}
    ];
    const lanes=[['next','Next'],['doing','Doing'],['waiting','Waiting'],['review','Review']];
    let view='board',category='all',selectedCard=null,selectedProject='prairie-drought',projectMode='managed';
    const stage=document.getElementById('stage'),detail=document.getElementById('detail'),toolbar=document.getElementById('toolbar'),toast=document.getElementById('toast');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const project=id=>projects.find(p=>p.id===id);
    function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),2400)}
    function setView(next){view=next;selectedCard=null;detail.innerHTML='';document.querySelectorAll('.view').forEach(b=>b.classList.toggle('active',b.dataset.view===view));toolbar.classList.toggle('hidden',view!=='board');render()}
    function render(){if(view==='board')renderBoard();if(view==='projects')renderProjects();if(view==='inbox')renderInbox()}
    function renderBoard(){
      const filtered=cards.filter(c=>category==='all'||project(c.project).category===category);
      stage.innerHTML=`<form class="capture" id="capture"><input class="control" placeholder="Next action" aria-label="Next action"><select class="control">${projects.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><button class="save">Add</button></form><div class="board">${lanes.map(([id,label])=>{const items=filtered.filter(c=>c.lane===id);return `<section class="lane"><header class="lane-head"><span class="lane-title"><span class="dot ${id}"></span>${label}</span><span class="lane-count">${items.length}</span></header><div class="cards">${items.length?items.map(cardHtml).join(''):'<div class="empty">No actions here</div>'}</div></section>`}).join('')}</div>`;
      document.getElementById('capture').addEventListener('submit',event=>{event.preventDefault();notify('Prototype only — would add one human-managed action.')});
      stage.querySelectorAll('[data-card]').forEach(button=>button.addEventListener('click',()=>openCard(button.dataset.card)));
      stage.querySelectorAll('[data-move]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();moveCard(button.dataset.move,Number(button.dataset.step))}));
    }
    function cardHtml(card){const p=project(card.project),index=lanes.findIndex(([id])=>id===card.lane);return `<article class="card ${selectedCard===card.id?'selected':''}"><div class="card-top"><span class="project-pill">${esc(p.name)}</span>${card.priority?`<span class="priority">${esc(card.priority)}</span>`:''}</div><button class="card-title" data-card="${card.id}">${esc(card.title)}</button><div class="card-body">${esc(card.body)}</div><div class="card-foot"><span class="badges"><span class="badge" title="Kanban action">▦</span><span class="badge" title="Obsidian project">◫</span>${p.github?'<span class="badge" title="GitHub evidence">⌁</span>':''}</span><span class="moves">${index>0?`<button class="move" data-move="${card.id}" data-step="-1" title="Move left">‹</button>`:''}${index<lanes.length-1?`<button class="move" data-move="${card.id}" data-step="1" title="Move right">›</button>`:''}</span></div></article>`}
    function moveCard(id,step){const card=cards.find(c=>c.id===id),index=lanes.findIndex(([lane])=>lane===card.lane);card.lane=lanes[index+step][0];selectedCard=id;renderBoard();openCard(id);notify(`Moved to ${lanes[index+step][1]}. Prototype state only.`)}
    function openCard(id){selectedCard=id;renderBoard();const card=cards.find(c=>c.id===id),p=project(card.project);detail.innerHTML=`<div class="detail-head"><div><div class="kicker">Kanban action · ${esc(lanes.find(([lane])=>lane===card.lane)[1])}</div><h2>${esc(card.title)}</h2></div><button class="close" id="close-detail">×</button></div><div class="detail-wrap"><section class="detail-section"><div class="section-label">Action</div><div class="truth"><div class="truth-row"><div class="field">Project</div><div class="value strong">${esc(p.name)}</div></div><div class="truth-row"><div class="field">Details</div><div class="value">${esc(card.body)}</div></div></div></section>${projectTruth(p)}<div class="boundary">Move work in Kanban. Record project reasoning in Obsidian. GitHub and devices remain evidence only.</div></div>`;document.getElementById('close-detail').addEventListener('click',()=>{selectedCard=null;detail.innerHTML='';renderBoard()})}
    function projectTruth(p){return `<section class="detail-section"><div class="section-label">Linked project truth</div><div class="truth"><div class="truth-row"><div class="field">Goal</div><div class="value">${esc(p.goal)}</div></div><div class="truth-row"><div class="field">Next action</div><div class="value strong">${esc(p.next)}</div></div><div class="truth-row"><div class="field">Blocker</div><div class="value ${p.blocker?'blocked':''}">${esc(p.blocker||'None recorded')}</div></div></div></section><section class="detail-section"><div class="section-label">Evidence</div><div class="evidence"><div class="evidence-row"><div class="evidence-title"><span class="source github">GitHub</span><span class="fresh">Current</span></div><div class="evidence-main">${esc(p.github||'No linked repository')}</div><div class="evidence-sub">${esc(p.push||'No GitHub activity')}</div></div><div class="evidence-row"><div class="evidence-title"><span class="source device">Device</span><span class="${p.stale?'stale':'fresh'}">${p.stale?'Stale · 9d':'Observed'}</span></div><div class="evidence-main">Last observed on ${esc(p.device)}</div><div class="evidence-sub">Observed ${esc(p.observed)} · activity ${esc(p.activity)} · ${p.dirty} dirty · ${p.ahead} ahead</div></div></div></section>`}
    function renderProjects(){
      const managedRows=projects.map(p=>`<button class="project-row ${p.id===selectedProject?'selected':''}" data-project="${p.id}"><span><span class="project-name">${esc(p.name)}</span><span class="project-next">Next: ${esc(p.next)}</span><span class="project-meta"><span>⌁ ${esc(p.push||'No GitHub source')}</span><span class="${p.stale?'stale-text':''}">◉ Last observed on ${esc(p.device)} · ${esc(p.observed)}</span></span></span><span class="chevron">›</span></button>`).join('');
      const unmatchedRows=`<div class="unmatched-help">Evidence is not a project. Create a canonical Obsidian note to admit it; this view never creates Inbox cards.</div>${unmatched.map(item=>`<div class="unmatched-row"><div class="unmatched-name">${esc(item.name)}</div><div class="unmatched-meta">${esc(item.meta)}</div></div>`).join('')}`;
      const rows=projectMode==='managed'?managedRows:unmatchedRows;
      stage.innerHTML=`<div class="projects-layout" id="projects-layout"><section class="project-list"><header class="list-head"><span>${projectMode==='managed'?'Managed projects':'Unmatched observations'}</span><button class="button" id="toggle-unmatched">${projectMode==='managed'?'Unmatched · 3':'Managed · 8'}</button></header>${rows}</section><aside class="project-detail" id="project-detail"></aside></div>`;
      document.getElementById('toggle-unmatched').addEventListener('click',()=>{projectMode=projectMode==='managed'?'unmatched':'managed';renderProjects()});
      stage.querySelectorAll('[data-project]').forEach(button=>button.addEventListener('click',()=>{selectedProject=button.dataset.project;renderProjects();document.getElementById('projects-layout').classList.add('detail-open')}));
      renderProjectDetail();
    }
    function renderProjectDetail(){const pane=document.getElementById('project-detail');if(!pane||projectMode!=='managed'){if(pane)pane.innerHTML='<div class="inbox-boundary"><div><div class="icon">⌕</div><h2>Unmatched evidence</h2><p>Review only. Nothing here is project truth or actionable work.</p></div></div>';return}const p=project(selectedProject);pane.innerHTML=`<button class="button" id="back-projects">‹ Projects</button><div class="kicker" style="margin-top:12px">Canonical project</div><h2>${esc(p.name)}</h2><div class="subtitle">project_id: ${esc(p.id)} · ${esc(p.categoryLabel)}</div><div class="project-actions"><button class="button primary" id="open-obsidian">Open in Obsidian</button><button class="button" id="show-actions">Show actions</button></div>${projectTruth(p)}`;document.getElementById('back-projects').addEventListener('click',()=>document.getElementById('projects-layout').classList.remove('detail-open'));document.getElementById('open-obsidian').addEventListener('click',()=>notify(`Prototype only — would open “${p.name}” in Obsidian.`));document.getElementById('show-actions').addEventListener('click',()=>{category=p.category;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.category===category));setView('board')})}
    function renderInbox(){stage.innerHTML=`<div class="inbox-boundary"><div><div class="icon">⌂</div><h2>Inbox lives on Office Desktop</h2><p>This device does not clone or synchronize the Inbox. GitHub and device signals are converted into candidates only by the office host.</p><button class="button" style="margin-top:12px" id="inbox-demo">Preview office boundary</button></div></div>`;document.getElementById('inbox-demo').addEventListener('click',()=>notify('Prototype only — Office Desktop currently has 3 candidates.'))}
    document.querySelectorAll('.view').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));
    document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{category=button.dataset.category;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===button));renderBoard()}));
    document.getElementById('add-action').addEventListener('click',()=>document.getElementById('capture').classList.toggle('open'));
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){selectedCard=null;detail.innerHTML='';if(view==='board')renderBoard()}});
    render();
  </script>
</body>
</html>
